name: sis-phs

services:
  frontend:
    container_name: sis-phs-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:9001:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "if [ ! -d node_modules/@tailwindcss/vite ]; then
        npm install --legacy-peer-deps;
      fi &&
      npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:9002/api
      - VITE_API_PROXY_TARGET=http://backend:8000
    networks:
      - sis_phs_net

  backend:
    container_name: sis-phs-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:9002:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:9002
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sis_phs
      - DB_USERNAME=sisphs
      - DB_PASSWORD=sisphs123
      - CORS_ALLOWED_ORIGINS=*
      - WAIT_FOR_DB=false
    networks:
      - sis_phs_net

  mysql:
    container_name: sis-phs-mysql-backend
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "0.0.0.0:9003:3306"
    environment:
      - MYSQL_DATABASE=sis_phs
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=sisphs
      - MYSQL_PASSWORD=sisphs123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sis_phs_net

volumes:
  mysql_data:
  frontend_node_modules:
  backend_vendor:

networks:
  sis_phs_net:
